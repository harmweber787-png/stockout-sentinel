# Pruefkette bei jedem Push und Pull Request: Tests, Lint, Typen.
#
# Installiert werden nur die leichten Abhaengigkeiten. torch und timesfm
# (mehrere GB, Modellgewichte von Hugging Face) bleiben aussen vor; die
# Alt-Tests des Dispositions-Service laufen mit dem Fake-Forecaster aus
# tests/conftest.py und pruefen den Verweigerungspfad ohne echtes Modell.
#
# Zwei Jobs, weil zwei getrennte Projekte im Baum liegen: "checks" prueft den
# Dispositions-Service und die Discovery-Engine an der Wurzel, "inbox-copilot"
# prueft das gleichnamige Unterprojekt mit dessen eigener Kette aus
# inbox-copilot/pyproject.toml. Sie teilen keine Abhaengigkeiten und scheitern
# unabhaengig voneinander.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: pytest, ruff, mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-kmu-discovery.txt
            requirements.txt

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-kmu-discovery.txt
          # Leichte Laufzeit des Dispositions-Service fuer tests/ (ohne torch/timesfm).
          # streamlit ist dabei, sonst ueberspringt tests/test_ui.py seine 56 Faelle.
          python -m pip install "fastapi>=0.111" "uvicorn[standard]>=0.30" "pandas>=2.2" \
            "numpy>=1.26" "python-multipart>=0.0.9" "httpx>=0.27" "streamlit>=1.50"

      - name: pytest
        run: python -m pytest -p no:cacheprovider

      - name: ruff
        run: |
          ruff check kmu_discovery tests_kmu_discovery scripts
          ruff format --check kmu_discovery/sources/lindas.py kmu_discovery/sources/zefix.py \
            kmu_discovery/sources/legal_forms.py scripts/probe_zefix.py \
            tests_kmu_discovery/test_sources_lindas.py tests_kmu_discovery/test_sources_zefix.py \
            tests_kmu_discovery/test_probe_zefix.py

      - name: mypy --strict
        run: python -m mypy --strict --config-file pyproject.toml

  inbox-copilot:
    name: "inbox-copilot: pytest, ruff, mypy --strict"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: inbox-copilot
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: inbox-copilot/pyproject.toml

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        # Die Live-Tests rufen die echte Anthropic-API auf und sind in
        # pyproject.toml per addopts abgewaehlt; hier laeuft nur die netzfreie
        # Suite.
        run: python -m pytest -p no:cacheprovider

      - name: mypy --strict
        run: python -m mypy

      - name: ruff
        run: |
          ruff check .
          ruff format --check .
