  - id: treuhand
    label: "Treuhand, Buchhaltung, Steuer- und Lohnverarbeitung"
    rationale: >-
      Steuer- und Lohnberechnung im Kundenauftrag: direkte Vermoegenshaftung
      bei Fehlern, Revisionsaufsicht.
    weak_hits_for_review: 2
    noga_reject_prefixes: ["69.20"]
    veto_terms:
      - "software fuer treuhaender"
      - "loesung fuer treuhandbueros"
      - "unsere referenzkunden"
      - "unser treuhaender erledigt"
