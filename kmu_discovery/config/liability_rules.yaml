# Haftungs-K.o.-Katalog der Problem-Discovery-Engine
#
# Betriebe, deren KERNTAETIGKEIT in eines dieser Felder faellt, werden vor dem
# Scoring ausgeschlossen. Der Filter ist deterministisch: NOGA-Praefixe und
# Wortlisten, kein LLM-Ermessen. Grenzfaelle erhalten REVIEW statt eines
# stillen Durchlassens.
#
# Wirkungslogik (in gates/liability.py implementiert, nicht hier konfigurierbar):
#   NOGA in noga_reject_prefixes          -> REJECT
#   NOGA in noga_review_prefixes          -> REVIEW
#   decisive-Begriff in Zweck/Name        -> REJECT
#   decisive-Begriff auf Website/Inserat  -> REJECT
#   >= weak_hits_for_review schwache Begriffe im Zweck  -> REJECT
#   >= weak_hits_for_review schwache Begriffe sonstwo   -> REVIEW
#
# veto_terms sind bewusst MEHRWORTIG: sie sollen Zulieferer entlarven
# ("Software fuer Arztpraxen"), nicht echte Treffer wegdruecken.

version: "2026-09-14"
context_veto_window: 140

domains:
  # ------------------------------------------------------------------ #
  - id: gesundheit
    label: "Gesundheit und Heilberufe"
    rationale: >-
      Verarbeitung besonders schuetzenswerter Personendaten (Gesundheitsdaten)
      nach revDSG Art. 5 lit. c; zusaetzlich Berufshaftung.
    weak_hits_for_review: 3
    noga_reject_prefixes: ["86", "87", "88.10", "47.73"]
    noga_review_prefixes: ["75", "47.74", "88.91"]
    veto_terms:
      - "software fuer arztpraxen"
      - "loesung fuer arztpraxen"
      - "software fuer praxen"
      - "unsere referenzkunden"
      - "wir entwickeln software"
      - "hersteller von medizintechnik"
    terms:
      - {id: arztpraxis, term: Arztpraxis, decisive: true}
      - {id: hausarzt, term: Hausarzt, decisive: true}
      - {id: kinderarzt, term: Kinderarzt, decisive: true}
      - {id: zahnarzt, term: Zahnarzt, decisive: true}
      - {id: zahnaerztin, term: Zahnärztin, decisive: true}
      - {id: dentalhygiene, term: Dentalhygiene, decisive: true}
      - {id: physiotherapie, term: Physiotherapie, decisive: true}
      - {id: ergotherapie, term: Ergotherapie, decisive: true}
      - {id: psychotherapie, term: Psychotherapie, decisive: true}
      - {id: logopaedie, term: Logopädie, decisive: true}
      - {id: podologie, term: Podologie, decisive: true}
      - {id: osteopathie, term: Osteopathie, decisive: true}
      - {id: chiropraktik, term: Chiropraktik, decisive: true}
      - {id: naturheilpraxis, term: Naturheilpraxis, decisive: true}
      - {id: heilpraktiker, term: Heilpraktiker, decisive: true}
      - {id: akupunktur, term: Akupunktur, decisive: true}
      - {id: homoeopathie, term: Homöopathie, decisive: true}
      - {id: hebamme, term: Hebamme, decisive: true}
      - {id: spitex, term: Spitex, decisive: true}
      - {id: pflegeheim, term: Pflegeheim, decisive: true}
      - {id: altersheim, term: Altersheim, decisive: true}
      - {id: apotheke, term: Apotheke, decisive: true}
      - {id: spital, term: Spital, decisive: true, note: "Auch 'Spitalbedarf' - Grenzfall bewusst streng."}
      - {id: klinik, term: Klinik, decisive: true}
      - {id: praxisgemeinschaft, term: Praxisgemeinschaft, decisive: true}
      - {id: tarmed, term: Tarmed, decisive: true}
      - {id: patient, term: Patient}
      - {id: sprechstunde, term: Sprechstunde}
      - {id: krankenkasse, term: Krankenkasse}
      - {id: anamnese, term: Anamnese}
      - {id: krankengeschichte, term: Krankengeschichte}
      - {id: behandlung, term: Behandlung}
      - {id: diagnose, term: Diagnose}
      - {id: rezeptur, term: Rezeptur}

