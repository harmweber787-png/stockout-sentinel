# Werkzeugkonfiguration fuer das Paket kmu_discovery.
# Bewusst auf dieses Paket beschraenkt: der aeltere Stockout-Sentinel-Code
# unter src/ bleibt von diesen Regeln unberuehrt.

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["kmu_discovery/**/*.py", "tests_kmu_discovery/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "D", "PTH", "DTZ"]
ignore = [
    "D203",   # kollidiert mit D211
    "D213",   # kollidiert mit D212
    "D401",   # deutschsprachige Docstrings folgen nicht dem englischen Imperativ
]

[tool.ruff.lint.per-file-ignores]
"tests_kmu_discovery/**" = ["D100", "D103", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["kmu_discovery", "tests_kmu_discovery"]
plugins = []
warn_unreachable = true
